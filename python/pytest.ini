[pytest]
# systest.py: echte Aufnahmen; einheitentest.py: Grenz- und Fehlerfaelle der Bausteine
testpaths = systest.py einheitentest.py
# Kein Traceback: "<gezaehlt>/<erwartet>" steht in der Zeile der Aufnahme und die Abweichung in
# der Zusammenfassung darunter, der Quelltext der Testfunktion sagt nichts dazu. Stuerzt dagegen
# eine Uebung ab, zeigt "pytest --tb=short" die Stelle.
# -v: eine Zeile pro Aufnahme statt Punkten, damit "<gezaehlt>/<erwartet>" daneben passt
addopts = --tb=no -v
